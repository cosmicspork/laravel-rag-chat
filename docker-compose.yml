services:
  app:
    image: ghcr.io/cosmicspork/laravel-rag-chat:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    env_file:
      - .env.production
    networks:
      - laravel-network-tst
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: laravel
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laravel-network-tst
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis:
  #   image: redis:latest
  #   volumes:
  #     - redisdata:/data
  #   networks:
  #     - laravel-network
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
  redisdata:

networks:
  laravel-network-tst: